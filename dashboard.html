<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vocabulary Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>My Vocabulary</h1>

        <p>15-Day Vocabulary Challenge</p>

        <div class="dashboard-grid">

            <div class="stat-card">
                <h2 id="totalWords">50</h2>
                <p>Total Words</p>
            </div>

            <div class="stat-card">
                <h2 id="reviewedWords">0</h2>
                <p>Reviewed</p>
            </div>

            <div class="stat-card">
                <h2 id="masteredWords">0</h2>
                <p>Mastered</p>
            </div>

            <div class="stat-card">
                <h2 id="reviewToday">0</h2>
                <p>Review Today</p>
            </div>

        </div>

        <button id="startLearning">
            Start Learning
        </button>

    </div>
<script src="dashboard.js"></script>
</body>

</html>
